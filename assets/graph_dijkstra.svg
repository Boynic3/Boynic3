<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <path id="path-highlight" d="M 60 190 L 100 90 L 170 60" fill="none"/>
  </defs>

  <rect x="1" y="1" width="238" height="238" rx="14" fill="#2A1214" stroke="#4A2626" stroke-width="2"/>

  <!-- muted background edges -->
  <g stroke="#4A2626" stroke-width="1.5" fill="none">
    <line x1="60" y1="190" x2="150" y2="180"/>
    <line x1="150" y1="180" x2="170" y2="60"/>
    <line x1="60" y1="190" x2="30" y2="90"/>
    <line x1="30" y1="90" x2="100" y2="90"/>
    <line x1="100" y1="90" x2="150" y2="180"/>
  </g>

  <!-- highlighted path -->
  <use href="#path-highlight" stroke="#CF6A3B" stroke-width="3"/>

  <!-- nodes -->
  <g fill="#B98F8A">
    <circle cx="60" cy="190" r="6"/>
    <circle cx="150" cy="180" r="6"/>
    <circle cx="30" cy="90" r="6"/>
  </g>
  <g fill="#F0E4DE">
    <circle cx="100" cy="90" r="7"/>
    <circle cx="170" cy="60" r="7"/>
  </g>

  <!-- traveling pulse along the highlighted path -->
  <circle r="5" fill="#F0E4DE">
    <animateMotion dur="2.6s" repeatCount="indefinite" path="M 60 190 L 100 90 L 170 60"/>
  </circle>

  <text x="120" y="222" text-anchor="middle" font-family="ui-monospace, 'Cascadia Code', 'Fira Code', monospace" font-size="11" fill="#B98F8A">grafo · dijkstra</text>
</svg>