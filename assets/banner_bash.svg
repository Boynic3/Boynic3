<svg viewBox="0 0 900 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#170B0C"/>
      <stop offset="100%" stop-color="#2A1214"/>
    </linearGradient>

    <!-- MÁSCARA ANIMADA: Controla a largura revelada do texto e simula o Backspace -->
    <clipPath id="typing-clip">
      <rect x="210" y="150" height="30" width="0">
        <animate attributeName="width"
                 values="0; 77; 77; 58; 58; 77; 77; 0; 0; 115; 115; 77; 77; 163; 163; 0; 0; 192; 192; 154; 154; 269; 269; 0; 0; 77; 77; 67; 67; 192; 192; 0; 0"
                 keyTimes="0; 0.04; 0.06; 0.07; 0.08; 0.10; 0.15; 0.16; 0.18; 0.24; 0.26; 0.28; 0.29; 0.36; 0.41; 0.42; 0.44; 0.52; 0.54; 0.56; 0.57; 0.65; 0.72; 0.73; 0.75; 0.79; 0.81; 0.82; 0.83; 0.92; 0.98; 0.99; 1"
                 dur="20s" repeatCount="indefinite" />
      </rect>
    </clipPath>
  </defs>

  <rect width="900" height="200" rx="10" fill="url(#bg)"/>

  <!-- Grafismo decorativo de rede à direita -->
  <g opacity="0.14" stroke="#A8384A" stroke-width="1.5" fill="none">
    <line x1="650" y1="60" x2="720" y2="40"/>
    <line x1="720" y1="40" x2="790" y2="70"/>
    <line x1="720" y1="40" x2="700" y2="120"/>
    <line x1="700" y1="120" x2="780" y2="150"/>
    <line x1="650" y1="60" x2="700" y2="120"/>
  </g>
  <g opacity="0.25" fill="#A8384A">
    <circle cx="650" cy="60" r="4"/>
    <circle cx="720" cy="40" r="4"/>
    <circle cx="790" cy="70" r="4"/>
    <circle cx="700" cy="120" r="4"/>
    <circle cx="780" cy="150" r="4"/>
  </g>

  <!-- Barra do topo -->
  <rect x="0" y="0" width="900" height="30" rx="10" fill="#2A1214"/>
  <rect x="0" y="20" width="900" height="10" fill="#2A1214"/>
  <circle cx="22" cy="15" r="5" fill="#7A1F2B"/>
  <circle cx="42" cy="15" r="5" fill="#A8384A"/>
  <circle cx="62" cy="15" r="5" fill="#4A2626"/>
  <text x="90" y="19" font-family="ui-monospace, 'Cascadia Code', 'Fira Code', monospace" font-size="12" fill="#B98F8A">bash — Matheus</text>

  <!-- Bloco estático (topo) -->
  <text x="40" y="72" font-family="ui-monospace, 'Cascadia Code', 'Fira Code', monospace" font-size="16" fill="#B98F8A">
    <tspan fill="#A8384A">matheus</tspan>@<tspan fill="#B98F8A">github</tspan>:~$ whoami
  </text>

  <text x="40" y="115" font-family="ui-monospace, 'Cascadia Code', 'Fira Code', monospace" font-size="32" font-weight="700" fill="#F0E4DE">
    Matheus Moretti Soares
  </text>

  <text x="40" y="145" font-family="ui-monospace, 'Cascadia Code', 'Fira Code', monospace" font-size="16" fill="#B98F8A">
    Engenharia de Software · Backend Developer
  </text>

  <!-- Linha de comando dinâmica -->
  <text x="40" y="172" font-family="ui-monospace, 'Cascadia Code', 'Fira Code', monospace" font-size="16" fill="#B98F8A">
    <tspan fill="#A8384A">matheus</tspan>@<tspan fill="#B98F8A">github</tspan>:~$
  </text>

  <!-- Textos que aparecem e desaparecem com a máscara -->
  <g clip-path="url(#typing-clip)">
    
    <!-- 1. git inut -> git init -->
    <text x="210" y="172" font-family="ui-monospace, 'Cascadia Code', 'Fira Code', monospace" font-size="16" fill="#F0E4DE">
      <animate attributeName="opacity" values="1; 1; 0; 0" keyTimes="0; 0.069; 0.07; 1" dur="20s" repeatCount="indefinite"/>
      git inut
    </text>
    <text x="210" y="172" font-family="ui-monospace, 'Cascadia Code', 'Fira Code', monospace" font-size="16" fill="#F0E4DE">
      <animate attributeName="opacity" values="0; 0; 1; 1; 0; 0" keyTimes="0; 0.069; 0.07; 0.159; 0.16; 1" dur="20s" repeatCount="indefinite"/>
      git init
    </text>

    <!-- 2. git add read -> git add README.md -->
    <text x="210" y="172" font-family="ui-monospace, 'Cascadia Code', 'Fira Code', monospace" font-size="16" fill="#F0E4DE">
      <animate attributeName="opacity" values="0; 0; 1; 1; 0; 0" keyTimes="0; 0.159; 0.16; 0.279; 0.28; 1" dur="20s" repeatCount="indefinite"/>
      git add read
    </text>
    <text x="210" y="172" font-family="ui-monospace, 'Cascadia Code', 'Fira Code', monospace" font-size="16" fill="#F0E4DE">
      <animate attributeName="opacity" values="0; 0; 1; 1; 0; 0" keyTimes="0; 0.279; 0.28; 0.419; 0.42; 1" dur="20s" repeatCount="indefinite"/>
      git add README.md
    </text>

    <!-- 3. git commit -m "hell -> git commit -m "Hello World!" -->
    <text x="210" y="172" font-family="ui-monospace, 'Cascadia Code', 'Fira Code', monospace" font-size="16" fill="#F0E4DE">
      <animate attributeName="opacity" values="0; 0; 1; 1; 0; 0" keyTimes="0; 0.419; 0.42; 0.559; 0.56; 1" dur="20s" repeatCount="indefinite"/>
      git commit -m "hell
    </text>
    <text x="210" y="172" font-family="ui-monospace, 'Cascadia Code', 'Fira Code', monospace" font-size="16" fill="#F0E4DE">
      <animate attributeName="opacity" values="0; 0; 1; 1; 0; 0" keyTimes="0; 0.559; 0.56; 0.729; 0.73; 1" dur="20s" repeatCount="indefinite"/>
      git commit -m "Hello World!"
    </text>

    <!-- 4. git pusg -> git push origin main -->
    <text x="210" y="172" font-family="ui-monospace, 'Cascadia Code', 'Fira Code', monospace" font-size="16" fill="#F0E4DE">
      <animate attributeName="opacity" values="0; 0; 1; 1; 0; 0" keyTimes="0; 0.729; 0.73; 0.819; 0.82; 1" dur="20s" repeatCount="indefinite"/>
      git pusg
    </text>
    <text x="210" y="172" font-family="ui-monospace, 'Cascadia Code', 'Fira Code', monospace" font-size="16" fill="#F0E4DE">
      <animate attributeName="opacity" values="0; 0; 1; 1; 0; 0" keyTimes="0; 0.819; 0.82; 0.989; 0.99; 1" dur="20s" repeatCount="indefinite"/>
      git push origin main
    </text>

  </g>

  <!-- Cursor Laranja Dinâmico -->
  <rect x="210" y="158" width="10" height="18" fill="#CF6A3B">
    <!-- A posição X do cursor foi deslocada em exatos +15px em todos os keyframes -->
    <animate attributeName="x"
             values="210; 287; 287; 268; 268; 287; 287; 210; 210; 325; 325; 287; 287; 373; 373; 210; 210; 402; 402; 364; 364; 479; 479; 210; 210; 287; 287; 277; 277; 402; 402; 210; 210"
             keyTimes="0; 0.04; 0.06; 0.07; 0.08; 0.10; 0.15; 0.16; 0.18; 0.24; 0.26; 0.28; 0.29; 0.36; 0.41; 0.42; 0.44; 0.52; 0.54; 0.56; 0.57; 0.65; 0.72; 0.73; 0.75; 0.79; 0.81; 0.82; 0.83; 0.92; 0.98; 0.99; 1"
             dur="20s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="1;0;1" dur="0.8s" repeatCount="indefinite"/>
  </rect>

</svg>
